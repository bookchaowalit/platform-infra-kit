apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-local-reader
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-local-reader
  namespace: platform
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-local-reader
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: eso-local-reader
    namespace: platform
roleRef:
  kind: Role
  name: eso-local-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-local-kubernetes
  namespace: platform
spec:
  provider:
    kubernetes:
      remoteNamespace: platform
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-local-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-local-derived
  namespace: platform
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: eso-local-kubernetes
    kind: SecretStore
  target:
    name: eso-local-derived
    creationPolicy: Owner
  data:
    - secretKey: demo
      remoteRef:
        key: eso-local-source
        property: demo
