{{- if and .Values.gateway.enabled (ne .Values.mode "worker") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "solo-app.fullname" . }}
  labels:
    {{- include "solo-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gateway.pathType | default "PathPrefix" }}
            value: {{ .Values.gateway.path | default "/" }}
      backendRefs:
        - name: {{ include "solo-app.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
