apiVersion: v1
kind: Service
metadata:
  name: netbox-redis
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  selector:
    app.kubernetes.io/name: netbox-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-redis
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: solo-empire
        solo.empire/environment: homelab
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/valkey/valkey:9.1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - exec valkey-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: netbox-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-redis-data
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-redis-cache
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-redis-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  selector:
    app.kubernetes.io/name: netbox-redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-redis-cache
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-redis-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-redis-cache
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: solo-empire
        solo.empire/environment: homelab
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-cache
          image: docker.io/valkey/valkey:9.1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - exec valkey-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_CACHE_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_CACHE_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-cache-data
              mountPath: /data
      volumes:
        - name: redis-cache-data
          persistentVolumeClaim:
            claimName: netbox-redis-cache-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-redis-cache-data
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-redis-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
