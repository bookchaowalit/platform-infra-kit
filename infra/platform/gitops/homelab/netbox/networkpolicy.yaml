apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbox-data-ingress
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-data
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - netbox-postgres
          - netbox-redis
          - netbox-redis-cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps-netbox-homelab
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - web
                  - worker
                  - bootstrap
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
