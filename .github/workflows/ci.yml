# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validators:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      # Stdlib validators; PyYAML is their only third-party import (as in platform-validate.yml).
      install-command: uv pip install "pyyaml==6.0.3"
      # The README's Python suites. platform-validate.yml keeps running them together with the
      # Helm, kubeconform, OpenTofu and supply-chain checks, which stay as they are.
      test-command: python infra/tests/platform/platform_validation_test.py --strict-platform && python infra/tests/platform/git_file_mode_test.py && python infra/tests/platform/onboarding_scripts_test.py

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
