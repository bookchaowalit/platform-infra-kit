# Shared dev environment overrides for solo-app.
# No real credentials or production domains.

app:
  environment: dev
  region: local

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging-placeholder"

podDisruptionBudget:
  enabled: true
  minAvailable: 0

networkPolicy:
  enabled: true

externalSecrets:
  enabled: false

serviceMonitor:
  enabled: false

topologySpreadConstraints:
  enabled: false
