apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbox
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: netbox
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
    solo.empire/team: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: solo-empire
        solo.empire/environment: homelab
        solo.empire/team: platform
    spec:
      serviceAccountName: netbox
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netbox
          image: docker.io/netboxcommunity/netbox:v4.6.7-5.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ALLOWED_HOSTS
              value: netbox.homelab.local localhost
            - name: CSRF_TRUSTED_ORIGINS
              value: http://netbox.homelab.local
            - name: DB_HOST
              value: netbox-postgres
            - name: DB_NAME
              value: netbox
            - name: DB_USER
              value: netbox
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: netbox-redis
            - name: REDIS_DATABASE
              value: "0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_PASSWORD
            - name: REDIS_CACHE_HOST
              value: netbox-redis-cache
            - name: REDIS_CACHE_DATABASE
              value: "1"
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_CACHE_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: SECRET_KEY
            - name: API_TOKEN_PEPPER_1
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: API_TOKEN_PEPPER_1
            - name: GRAPHQL_ENABLED
              value: "true"
            - name: METRICS_ENABLED
              value: "false"
            - name: WEBHOOKS_ENABLED
              value: "false"
            - name: LOGIN_REQUIRED
              value: "true"
            - name: CORS_ORIGIN_ALLOW_ALL
              value: "false"
            - name: ISOLATED_DEPLOYMENT
              value: "true"
            - name: RELEASE_CHECK_URL
              value: ""
            - name: SKIP_SUPERUSER
              value: "true"
            - name: TIME_ZONE
              value: Asia/Bangkok
            - name: GRANIAN_WORKERS
              value: "1"
            - name: GRANIAN_BACKPRESSURE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /login/
              port: http
              httpHeaders:
                - name: Host
                  value: netbox.homelab.local
            periodSeconds: 5
            timeoutSeconds: 15
            # NetBox v4.6 first-run migrations are large on this 4 GiB node.
            # Keep a long startup window so kubelet does not interrupt them.
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /login/
              port: http
              httpHeaders:
                - name: Host
                  value: netbox.homelab.local
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login/
              port: http
              httpHeaders:
                - name: Host
                  value: netbox.homelab.local
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: media
              mountPath: /opt/netbox/netbox/media
            - name: reports
              mountPath: /opt/netbox/netbox/reports
            - name: scripts
              mountPath: /opt/netbox/netbox/scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: netbox-media
        - name: reports
          emptyDir: {}
        - name: scripts
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-worker
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
    solo.empire/team: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: solo-empire
        solo.empire/environment: homelab
        solo.empire/team: platform
    spec:
      serviceAccountName: netbox
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-netbox
          image: docker.io/netboxcommunity/netbox:v4.6.7-5.0.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - "until curl -fsS -H 'Host: netbox.homelab.local' http://netbox/login/ >/dev/null; do sleep 5; done"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: worker
          image: docker.io/netboxcommunity/netbox:v4.6.7-5.0.2
          imagePullPolicy: IfNotPresent
          command:
            - /opt/netbox/venv/bin/python
            - /opt/netbox/netbox/manage.py
            - rqworker
          env:
            - name: ALLOWED_HOSTS
              value: netbox.homelab.local localhost
            - name: DB_HOST
              value: netbox-postgres
            - name: DB_NAME
              value: netbox
            - name: DB_USER
              value: netbox
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: netbox-redis
            - name: REDIS_DATABASE
              value: "0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_PASSWORD
            - name: REDIS_CACHE_HOST
              value: netbox-redis-cache
            - name: REDIS_CACHE_DATABASE
              value: "1"
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: REDIS_CACHE_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: SECRET_KEY
            - name: API_TOKEN_PEPPER_1
              valueFrom:
                secretKeyRef:
                  name: netbox-runtime
                  key: API_TOKEN_PEPPER_1
            - name: GRAPHQL_ENABLED
              value: "true"
            - name: METRICS_ENABLED
              value: "false"
            - name: WEBHOOKS_ENABLED
              value: "false"
            - name: LOGIN_REQUIRED
              value: "true"
            - name: CORS_ORIGIN_ALLOW_ALL
              value: "false"
            - name: ISOLATED_DEPLOYMENT
              value: "true"
            - name: RELEASE_CHECK_URL
              value: ""
            - name: SKIP_SUPERUSER
              value: "true"
            - name: TIME_ZONE
              value: Asia/Bangkok
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f rqworker >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: media
              mountPath: /opt/netbox/netbox/media
            - name: reports
              mountPath: /opt/netbox/netbox/reports
            - name: scripts
              mountPath: /opt/netbox/netbox/scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: netbox-media
        - name: reports
          emptyDir: {}
        - name: scripts
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-media
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netbox
  namespace: apps-netbox-homelab
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: solo-empire
    solo.empire/environment: homelab
    solo.empire/team: platform
spec:
  ingressClassName: nginx
  rules:
    - host: netbox.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netbox
                port:
                  name: http
