# Argo CD Application: ai-doc-assistant on Homelab K3s (non-production).
# Durable GitHub-backed source only. Never file://.
# Image tag is an immutable git-SHA set via Helm parameters after push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-doc-assistant-homelab
  namespace: argocd
  labels:
    app.kubernetes.io/name: ai-doc-assistant
    app.kubernetes.io/part-of: solo-empire
    solo.empire/component: ai-doc-assistant
    solo.empire/environment: homelab
    solo.empire/team: product
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: solo-empire-apps
  source:
    repoURL: git@github.com:bookchaowalit/solo-empire.git
    targetRevision: main
    path: infra/platform/helm/solo-app
    helm:
      releaseName: ai-doc-assistant
      valueFiles:
        - homelab/ai-doc-assistant.yaml
      parameters:
        # Replaced at apply/sync time with the published immutable tag.
        - name: image.repository
          value: registry.homelab.local:5000/solo-empire/ai-doc-assistant
        - name: image.tag
          value: git-pending
        - name: image.pullPolicy
          value: IfNotPresent
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-ai-doc-assistant-homelab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
