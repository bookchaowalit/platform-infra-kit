# Argo CD Application for the synthetic Homelab platform-smoke workload.
# Managed exclusively by Argo CD after the first apply of this resource.
# prune is intentionally disabled until the Git path is exclusive and reviewed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-smoke-homelab
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-smoke
    app.kubernetes.io/part-of: solo-empire-platform
    solo.empire/component: platform-smoke
    solo.empire/environment: homelab
    solo.empire/team: platform
    solo.empire/synthetic: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: solo-empire-apps
  source:
    # Canonical durable remote (private repo): requires a read-only deploy key
    # (or equivalent) registered in Argo CD AND this path present on main.
    # Live homelab bootstrap currently overrides repoURL to:
    #   file:///workspace/solo-empire
    # via a node-local snapshot mounted into argocd-repo-server. Same path and
    # targetRevision. Never commit credentials.
    repoURL: https://github.com/bookchaowalit/solo-empire.git
    targetRevision: main
    path: infra/platform/gitops/homelab/platform-smoke
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-smoke
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
