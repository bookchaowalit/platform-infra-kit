apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Containers must not run as root.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: "Running as root is not allowed. Set runAsNonRoot: true and a non-zero runAsUser."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
              =(runAsUser): ">0"
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
                  =(runAsUser): ">0"
