# Pilot app definition — source of truth for onboarding metadata.
# Scaffold/deploy scripts read this file. Does not deploy by itself.
apiVersion: solo.empire/v1
kind: PilotApp
metadata:
  name: booknbook
spec:
  team: product
  component: web
  mode: web
  partOf: solo-empire
  environment: dev
  region: local
  cluster: k3d-solo-dev
  source_path: projects/product/engineering/book-dev/github/bookchaowalit-website/book-products/booknbook
  dockerfile: projects/product/engineering/book-dev/github/bookchaowalit-website/book-products/booknbook/Dockerfile
  image_name: solo-empire/booknbook
  data_contract: pilot-local
  target_port: 3000
  run_as_user: 1001
  ingress_hostname: booknbook.dev.local
  probes:
    liveness: /healthz
    readiness: /readyz
    startup: /healthz
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
  runbook: operations/BOOKNBOOK-PILOT-RUNBOOK.md
  values_customized: true
