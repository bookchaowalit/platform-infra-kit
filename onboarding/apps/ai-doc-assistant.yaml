# Pilot app definition — source of truth for onboarding metadata.
# Scaffold/deploy scripts read this file. Does not deploy by itself.
apiVersion: solo.empire/v1
kind: PilotApp
metadata:
  name: ai-doc-assistant
spec:
  team: product
  component: api
  mode: web
  partOf: solo-empire
  environment: dev
  region: local
  cluster: k3d-solo-dev
  source_path: projects/product/engineering/book-dev/github/bookchaowalit/private/ai-doc-assistant
  dockerfile: projects/product/engineering/book-dev/github/bookchaowalit/private/ai-doc-assistant/Dockerfile
  image_name: solo-empire/ai-doc-assistant
  data_contract: pilot-local
  target_port: 8000
  ingress_hostname: ai-doc-assistant.dev.local
  probes:
    liveness: /healthz
    readiness: /readyz
    startup: /healthz
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
  runbook: operations/ai/AI-DOC-ASSISTANT-PILOT-RUNBOOK.md
  # Hand-tuned values (volumes, chroma emptyDir) live in values/dev; do not overwrite
  values_customized: true
